name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck, tests, and API Worker dry-run
        run: npm run check

      - name: Apply D1 migrations locally
        run: npm run db:local:migrate

      - name: Verify reference D1 fixture
        run: npm run db:local:smoke

      - name: Build static reference site
        run: npm run build

      - name: Static Worker dry-run
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
